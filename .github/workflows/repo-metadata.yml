# Keep the repository metadata in sync with .github/repo-metadata.json.
#
# The canonical values live in the repository, so the description and the
# topics are reviewable in a pull request instead of being edited by hand
# on the GitHub settings page.
#
# This workflow uses GITHUB_TOKEN, so it needs no secret of its own.

name: repo-metadata

on:
  push:
    paths:
      - .github/repo-metadata.json
      - .github/workflows/repo-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read the metadata
        id: meta
        run: |
          echo "description=$(jq -r '.description' .github/repo-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "homepage=$(jq -r '.homepage' .github/repo-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "topics=$(jq -c '.topics' .github/repo-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Apply it to the repository
        env:
          REPO_METADATA_TOKEN: ${{ secrets.REPO_METADATA_TOKEN }}
          DESCRIPTION: ${{ steps.meta.outputs.description }}
          HOMEPAGE: ${{ steps.meta.outputs.homepage }}
          TOPICS: ${{ steps.meta.outputs.topics }}
        run: |
          # GITHUB_TOKEN cannot do this: updating a repository needs the
          # Administration permission, which an Actions token does not carry.
          # A token that DOES carry it can — and the workflow stays a no-op
          # until one is configured.
          #
          # This sync is a convenience, not a gate: the repository's CI must
          # not turn red because a description could not be written. A token
          # that cannot do the job is therefore reported as a WARNING and the
          # step still succeeds; anything else — a malformed request, a
          # network failure — stays a failure.
          if [ -z "$REPO_METADATA_TOKEN" ]; then
            echo "No REPO_METADATA_TOKEN secret configured — leaving the metadata alone."
            exit 0
          fi
          jq -n --arg d "$DESCRIPTION" --arg h "$HOMEPAGE" --argjson t "$TOPICS" \
            '{description: $d, homepage: $h, topics: $t}' > /tmp/body.json
          if ! out=$(GH_TOKEN="$REPO_METADATA_TOKEN" gh api --method PATCH "repos/${{ github.repository }}" --input /tmp/body.json 2>&1); then
            # 403 means the token is valid but may not administer this
            # repository. A GitHub App installation token never can — only a
            # classic PAT with Administration rights on the repository does.
            if printf '%s' "$out" | grep -qE '"status":"403"|\(HTTP 403\)'; then
              echo "::warning::REPO_METADATA_TOKEN cannot administer this repository (HTTP 403) — leaving the metadata alone. It needs a classic PAT with the Administration permission on this repository."
              exit 0
            fi
            echo "::error::gh api failed: ${out}"
            exit 1
          fi
          echo "$out" | jq '{full_name, description, homepage, topics}'
